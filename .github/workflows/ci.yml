name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chrome stable
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Resolve Chrome path for E2E
        run: echo "CHROME=$(which chrome || which google-chrome || which google-chrome-stable)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Vision schema eval (offline)
        run: npm run evals

      - name: Integration tests (skips without API keys)
        run: npm run test:integration
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: E2E (headless Chrome, loads the extension)
        run: npm run e2e
