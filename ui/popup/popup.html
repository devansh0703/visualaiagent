<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Visual AI Agent</title>
  <link rel="stylesheet" href="../ui.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="row">
    <img src="../../icons/icon48.png" width="26" height="26" alt="logo" />
    <div class="grow">
      <h1>Visual AI Agent</h1>
      <div class="row" style="gap:6px">
        <span class="dot pulse" id="statusDot"></span>
        <span class="muted" id="statusText">connecting…</span>
        <span class="tag mono" id="modelTag" style="margin-left:6px" title="vision model"></span>
      </div>
    </div>
    <button class="ghost pill-btn" id="btnOptions" title="Options">⚙</button>
  </header>

  <div class="card" id="askCard">
    <h3>Ask the agent about this tab</h3>
    <div class="row" style="gap:6px">
      <input type="text" id="askInput" placeholder="e.g. what should I do next on this page?" />
      <button id="btnAsk" class="primary" style="white-space:nowrap">Ask</button>
    </div>
    <div class="row" style="gap:6px;margin-top:6px">
      <button id="btnPreset1" class="ghost pill-btn">Summarize</button>
      <button id="btnPreset2" class="ghost pill-btn">Improve</button>
      <button id="btnPreset3" class="ghost pill-btn">Distracted?</button>
    </div>
    <div id="askAnswer" class="muted" style="margin-top:6px;font-size:12px;white-space:pre-wrap;display:none"></div>
  </div>

  <div class="card" id="chatCard">
    <h3>Chatbot <span class="tag mono">sees this tab</span></h3>
    <div class="chat-log" id="chatLog"></div>
    <div class="row" style="gap:6px;margin-top:8px">
      <input type="text" id="chatInput" placeholder="Ask anything… e.g. fill the form with test data" />
      <button id="btnChat" class="primary" style="white-space:nowrap">Send</button>
    </div>
    <div class="chip-row">
      <button class="ghost pill-btn chip" data-chip="summarize this page">Summarize</button>
      <button class="ghost pill-btn chip" data-chip="list the forms on this page">Forms</button>
      <button class="ghost pill-btn chip" data-chip="list the links on this page">Links</button>
      <button class="ghost pill-btn chip" data-chip="fill the form with test data">Fill form</button>
      <button class="ghost pill-btn chip" data-chip="click the first button">Click</button>
      <button class="ghost pill-btn chip" data-chip="check the accessibility of this page">A11y</button>
    </div>
  </div>

  <div class="card" id="abilitiesCard">
    <div class="row">
      <h3>Agent abilities <span class="tag mono" id="abilCount">…</span></h3>
      <button id="btnToggleAbilities" class="ghost pill-btn" style="margin-left:auto">Show</button>
    </div>
    <div id="abilitiesBody" class="hidden"></div>
  </div>

  <div class="card" id="taskCard">
    <h3>Task agent (computer use)</h3>
    <div class="row" style="gap:6px">
      <input type="text" id="taskInput" placeholder="e.g. click the download button, then scroll down" />
      <button id="btnTask" class="primary" style="white-space:nowrap">Run</button>
    </div>
    <div class="row" style="gap:6px;margin-top:6px">
      <button id="btnTaskPreset1" class="ghost pill-btn">Click first button</button>
      <button id="btnTaskPreset2" class="ghost pill-btn">Type into field</button>
      <button id="btnTaskPreset3" class="ghost pill-btn">Scroll down</button>
      <button id="btnReport" class="ghost pill-btn">Analyze page</button>
    </div>
    <div id="taskResult" class="muted" style="margin-top:6px;font-size:12px;white-space:pre-wrap;display:none"></div>
  </div>

  <div id="scanModal" class="scan-modal hidden">
    <div class="scan-box card">
      <div class="row">
        <h3>Page scan</h3>
        <button class="ghost" id="scanClose" style="margin-left:auto">✕</button>
      </div>
      <div id="scanBody" class="muted">Scanning…</div>
    </div>
  </div>

  <div class="grid grid4 stats-grid" id="stats"></div>

  <div class="card">
    <h3>Session <span class="tag mono" id="sessionId">—</span></h3>
    <div class="row wrap" style="gap:6px">
      <span class="tag" id="sessionStart">started —</span>
      <span class="tag" id="sessionDuration">—</span>
      <span class="tag" id="focusTag">focus —</span>
    </div>
    <h3 style="margin-top:10px">Recent pages</h3>
    <div class="col" id="pages" style="font-size:12px"></div>
  </div>

  <div class="card">
    <h3>Recent insights</h3>
    <div class="col" id="insightsFeed" style="font-size:12px"></div>
  </div>

  <div class="card">
    <h3>Sites — last 60 min</h3>
    <div class="col" id="sitesList" style="font-size:12px"></div>
  </div>

  <div class="card">
    <h3>Quick controls</h3>
    <div class="col" id="controls" style="font-size:12px;gap:6px"></div>
  </div>

  <div class="card">
    <h3>Database sync</h3>
    <div class="row wrap" id="dbStatus">
      <span class="tag mono" id="dbEndpoint">no endpoint</span>
      <span class="tag" id="dbFlush">—</span>
      <span class="tag mono" id="dbQueue">—</span>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="btnFlush" class="ghost pill-btn">Flush now</button>
      <button id="btnExport" class="ghost pill-btn">Export JSON</button>
      <button id="btnDigest" class="ghost pill-btn" title="Generate a daily digest now">Digest</button>
      <button id="btnDigestWeekly" class="ghost pill-btn" title="Generate a weekly digest now">Week</button>
    </div>
  </div>

  <div class="row" style="margin-top:4px">
    <button id="btnPause" class="primary grow">Pause monitoring</button>
    <button id="btnCapture" class="grow">Capture</button>
    <button id="btnScan" class="grow">Scan page</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="btnDashboard" class="grow">Open dashboard</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
